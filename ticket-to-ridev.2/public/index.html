<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticket to Ride Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>

<main id="home" class="screen">
  <svg class="rail" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 150 C 200 30, 400 190, 600 100 S 1000 20, 1220 120"/>
  </svg>
  <section class="ticket">
    <h1>Ticket to Ride</h1>
    <p class="sub">Online, for 2 to 5 players. Bots welcome.</p>
    <label>Your name <input id="name" maxlength="16" autocomplete="nickname" placeholder="Conductor"></label>
    <button id="btnCreate" class="primary">Start a table</button>
    <p class="split">or join friends with a code</p>
    <div class="row"><input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" aria-label="Table code"><button id="btnJoin">Join table</button></div>
    <button id="btnHelp" class="link">How to play</button>
  </section>
</main>

<main id="lobby" class="screen hidden">
  <section class="ticket wide">
    <h2>Table <span id="lobbyCode" class="code"></span></h2>
    <p class="sub">Share the code or <button id="btnCopy" class="link">copy the invite link</button>.</p>
    <ul id="members" class="members"></ul>
    <div id="swatches" class="swatches" aria-label="Choose your train colour"></div>
    <div class="row">
      <button id="btnBot">Add a bot</button>
      <button id="btnStart" class="primary">Start the game</button>
    </div>
    <p id="lobbyHint" class="hint"></p>
    <details class="chatbox"><summary>Table chat</summary><div id="lobbyChat" class="chatlist"></div></details>
  </section>
</main>

<div id="game" class="hidden">
  <div id="three"></div>
  <div id="banner"></div>
  <div id="leftcol"><aside id="scores"></aside><section id="tpanel" class="panel tpanel hidden"></section></div>
  <aside id="market">
    <div id="faceup"></div>
    <div class="piles">
      <button id="deck" class="pile deck" title="Draw from the deck"><span>Deck</span><b id="deckN"></b></button>
      <button id="tickDeck" class="pile tix" title="Draw destination tickets"><span>Tickets</span><b id="tickN"></b></button>
    </div>
  </aside>
  <footer id="tray">
    <div id="hand"></div>
    <div id="mytickets"></div>
  </footer>
  <aside id="side">
    <div class="tabs"><button id="tabLog" class="on">Log</button><button id="tabChat">Chat <i id="unread" class="hidden"></i></button></div>
    <div id="log" class="feed"></div>
    <div id="chat" class="feed hidden"></div>
    <form id="chatForm" class="hidden"><input id="chatInput" maxlength="200" placeholder="Say something..." autocomplete="off"><button>Send</button></form>
    <div id="emotes"></div>
  </aside>
  <div id="tip" class="hidden"></div>
</div>

<button id="menuBtn" class="panel">Menu</button>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="/vendor/tone/build/Tone.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js';document.head.appendChild(s)"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/mapdata.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
